# Developer-mode roster — read only when the composition row sets `devMode: true`.
#
# These agents are this plugin's OWN sessions, not harness presets: `dev_agent_start`
# creates a peer session and records the binding in
# `$DSH_HOME/report-ledger/dev-agents.json`, and the plugin injects the role prompt
# by that binding. Nothing appears in the DSH preset picker, and the harness never
# learns these agents exist.
#
# `promptFile` is resolved against this file's directory. Editing this file rebuilds
# nothing: it is data, not code. Call `dev_agents_reload` (a tool that exists only in
# developer mode) to re-read it. A row that cannot be used is skipped and reported —
# the rest still applies, so one typo never disables the whole roster.
#
# Retirement: add `retired: true` to an entry instead of deleting it. A retired
# entry cannot be started any more, but sessions already bound to it keep their
# prompt plus a wind-down instruction telling them to hand their reports, checkouts
# and unpaid hand-offs over with `report_handover`. Deleting the row instead is not
# a retirement: those sessions would silently lose their instructions.
#
# This file is not in the published package (`package.json` `files` excludes it), so
# an installed deployment has no developer agents at all, whatever its config says:
# cloning the repository is the gate.

agents:
  - id: report-ledger:dev/probe
    name: 开发探查者
    description: 真实使用账本，把摩擦写成可复现的证据
    order: 10
    promptFile: prompts/probe.md

  - id: report-ledger:dev/verifier
    name: 开发复测者
    description: 只复测候选改动与基线的差异，不提方案
    order: 20
    promptFile: prompts/verifier.md
