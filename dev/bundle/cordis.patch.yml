# Developer-mode add-on for the dsh-report-ledger checkout.
#
# This bundle is the part a release artifact does not carry: it exists only in the
# repository (`dev/` is outside `files`), it is not published, and enabling it on an
# installed package does nothing — `installDevMode` returns early because
# `dev/agents.yml` is absent there. The release entry does not even import its code:
# the add-on is built separately into `dev/bundle/lib/`.
#
# Layering (this bundle sits after `dsh-report-ledger` in `dsh.profile.bundles`):
# the add-on is PURELY ADDITIVE and the release row stays enabled.
#
#   - the release row mounts the host half and publishes it as the `reportLedger`
#     service; this row lists that service in its `inject` and installs the `dev_*`
#     tools and the developer prompt section on top of it;
#   - when the release row goes away, the service is withdrawn and Cordis unloads
#     this row with it, so developer mode still cannot become the deployment on its
#     own — the guarantee is carried by the service lifetime instead of by
#     disabling the release row and polling the profile manifest;
#   - keeping the release row enabled is also what keeps the release package's
#     browser half served (`/plugins/dsh-report-ledger/client.js`), so developer
#     mode gets the same 「汇报」 tab as a release install.
#
# Host configuration (`announceToAgent`, `maxPeersPerAgent`, `worktree`) belongs to
# the release row now — this row has no config of its own. A patch replaces a row's
# whole config, so a developer who wants the worktree feature adds it to the
# release row in their profile's own patch rather than here.
- insert:
    - id: report-ledger-dev
      name: 'dsh-report-ledger-dev'
