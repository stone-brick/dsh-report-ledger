# Bundle patch for dsh-report-ledger: the release row only.
#
# The developer-mode row deliberately does NOT live here. It is contributed by
# `dev/bundle/` — an add-on bundle that exists only inside the checkout and is not
# in `files`, so a published artifact carries no developer-mode configuration at
# all. Two gates keep "only a clone can enable it":
#
#   1. the add-on is not published (it is part of `dev/`, which `files` excludes);
#   2. even a copied add-on is inert: `dev/agents.yml` is not in `files`, so
#      `installDevMode` returns early on every installed package.
#
# Developer mode is PURELY ADDITIVE: keep this row enabled and enable the
# `dsh-report-ledger-dev` add-on on top. Disabling this row withdraws the
# `reportLedger` service the add-on injects into, so Cordis unloads the add-on
# with it — no error, no dev tools. (`claimInstanceSlot` arbitrates two HOST rows;
# it is not the developer-mode switch.)
#
# The client half needs no row of its own: the loader scans enabled rows for the
# package's `dsh.client` manifest and serves the built `lib/client.js` over
# /plugins/<entryId>/client.js.
- insert:
    - id: report-ledger
      name: 'dsh-report-ledger'
      config:
        announceToAgent: true
