name: publish to npm

# 用「可信发布（trusted publishing / OIDC）」发布到 npm：
# **不需要任何 npm 令牌，也不需要手输一次性验证码**，并自动附带 provenance
# （构建来源证明，插件市场与用户都看重这个信任信号）。
#
# ── 首次启用前必须做的一步（一次性，需要交互式 2FA）──────────────────────────
#   在 npm 侧为本仓库建立信任关系：
#
#     npm trust github dsh-report-ledger \
#       --file publish.yml \
#       --repo stone-brick/dsh-report-ledger \
#       --allow-publish
#
#   --file 必须与下面这个工作流文件名完全一致（publish.yml），否则 npm 不会认。
#   未建立信任关系时，本工作流会在「Publish」这一步认证失败 —— 它只在推 tag 或
#   手动触发时运行，不影响日常 push。
#
# ── 发版流程 ────────────────────────────────────────────────────────────────
#   pnpm version patch   # 或 minor / major，会同时打 tag
#   git push origin main --follow-tags
#   之后 CI 自动发布；Gitee 镜像由 mirror-to-gitee.yml 同步。
#
# ── 纪律 ────────────────────────────────────────────────────────────────────
#   npm 不允许覆盖已发布版本号：version 必须先递增，否则这一步必定失败。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 创建 GitHub release（最后一步）需要它；发布 npm 本身不需要
  id-token: write # OIDC：可信发布与 provenance 的前提，缺它一定失败

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 是必需的，不是保险：默认的浅检出只把 tag 当成一个指向提交的
      # 轻量引用，于是下面「Create the GitHub release」里的
      # `git for-each-ref --format='%(contents)' refs/tags/<tag>` 拿到的是**提交**说明
      # 而不是 tag 说明——v0.2.5 第一次自动发 release 时正文就因此拿错了。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # ⚠ 这里**刻意不写 `registry-url`**，别加回去。
      #
      # `actions/setup-node` 一旦收到 `registry-url`，就会往 `~/.npmrc` 写一行
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # 本工作流没有（也不该有）NODE_AUTH_TOKEN，于是 npm 拿着一个**空令牌**去认证——
      # 它就此走上令牌那条路，**根本不会去做 OIDC 交换**，注册表回一个 404。
      #
      # 这个失败极具误导性：**配好可信发布之后报的错与配之前一字不差**，于是你会去查
      # 仓库名、workflow 文件名、environment name，而真正的原因在这一行。实测就是如此：
      # 信任关系建立并重跑后，错误仍是 `E404 PUT .../dsh-report-ledger`。
      #
      # 注册表默认就是 registry.npmjs.org（日志里那句 "Publishing to
      # https://registry.npmjs.org/ with tag latest and public access" 就是证据），
      # 所以删掉它不损失任何东西。
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Toolchain versions
        run: |
          node --version
          npm --version   # 可信发布要求 npm >= 11.5.1（Node 24 自带的满足）
          # npm 只在下面两个变量**同时存在**时才去交换 OIDC 令牌
          # （lib/utils/oidc.js：缺任一个就 log.silly 后静默 return）。
          # 它们由上面的 `id-token: write` 注入。缺了的话，npm 会跳过 OIDC，
          # 然后在 Publish 步扔一个与该原因毫无关系的 `ENEEDAUTH`——
          # 所以这两行是那次误诊的解药。只报长度，不打印值。
          for v in ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN NPM_ID_TOKEN; do
            eval "val=\$$v"
            if [ -n "$val" ]; then echo "$v: present (${#val} chars)"; else echo "$v: MISSING"; fi
          done

      # A tag is a claim about which version this is; the registry only checks
      # whether the number was ever published. Without this gate, a tag named
      # v0.3.0 can publish package.json's 0.2.1, because npm has never seen
      # 0.2.1 before. workflow_dispatch stays usable for the one manual first
      # publish, where no tag exists yet.
      - name: Tag matches package version
        if: github.ref_type == 'tag'
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # 发版前最后一道：npm 将要打出的包里不能有 dev/（开发者名册），bundle patch
      # 也不能把 devMode 打开。脚本自己打一次包来检查，与 Publish 的打包同一套规则；
      # 断言清单见 docs/publishing.md「开发者模式不能随包出去」。
      - name: Release boundary (no developer roster in the tarball)
        run: node scripts/release-boundary-check.ts

      # 发布用 npm CLI：可信发布的 OIDC 交换与 provenance 由它负责。
      # --ignore-scripts 是刻意的：构建已在上一步显式完成，避免 prepare /
      # prepublishOnly 再各跑一遍（本机 npm publish 会连跑两次构建）。
      #
      # 这里刻意**不跑 typecheck**：本仓库的类型来自 DSH profile 的官方包层
      # （见 docs/pitfalls.md「运行时解析需要 node_modules/@deepseek-ai junction」一条），
      # CI 里没有这一层；把官方包装成 devDependency 会在工作区复制一份服务注册表，
      # 反而破坏本地开发时的实例同一性。所以 CI 只跑确定性检查 + 构建。
      - name: Publish
        run: npm publish --ignore-scripts --access public

      # 发布走的是**异步**路径：provenance 自动启用后，注册表对上传回 `PUT 202 Accepted`
      # 并提示 "Your package is being processed and may take a few minutes to become
      # available."。于是 `npm publish` 的退出码 0 **并不代表版本已经可用**。
      #
      # 实测就是这个后果：v0.2.0 那次运行是绿的、日志里也有 `+ dsh-report-ledger@0.2.0`，
      # 而注册表在随后数分钟内查不到 0.2.0——packument 的 `time.modified` 仍停在 0.1.0，
      # 独立路径（curl、web_fetch、jsDelivr）都一致。那段时间里"发布成功了"与"什么都没发生"
      # 看起来完全一样，而 CI 一声不吭。
      #
      # 这一步把那个沉默的窗口变成一次明确的等待与断言：拿不到就红，而不是让一个绿勾
      # 替你声称一件没人核实过的事。
      - name: Verify the published version
        run: |
          version=$(node -p "require('./package.json').version")
          for i in $(seq 1 20); do
            if npm view "dsh-report-ledger@${version}" version >/dev/null 2>&1; then
              echo "dsh-report-ledger@${version} is available:"
              npm view "dsh-report-ledger@${version}" dist.shasum dist.integrity
              exit 0
            fi
            echo "attempt ${i}: accepted but not visible yet; waiting 15s"
            sleep 15
          done
          echo "::error::dsh-report-ledger@${version} was accepted by the registry but never became visible"
          exit 1

      # 标签推送除了发 npm，还要在 GitHub 上留一页 release —— 与 Gitee 镜像对称。
      # 这一步此前一直是手工的：v0.2.3 / v0.2.4 的 tag 在、release 页不在，原因不是
      # 发布失败（两个 workflow 都是 success），而是没有任何东西去写那一页。
      # 放在 Verify 之后：release 页声称「这个版本可用」，那就要等它真的可见。
      # 幂等：页已存在就只补附件（--clobber），重跑不报错。
      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          tgz="dsh-report-ledger-${version}.tgz"
          # 与 Gitee 附件同一套规则：从该 tag 的检出打 tarball（files 白名单，不含 dev/）
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/${tgz}"
          # 正文取该 tag 自己的说明（annotated tag message）；轻量 tag 没有正文时退回自动生成
          notes="$(git for-each-ref --format='%(contents)' "refs/tags/${TAG}")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; uploading the tarball"
            gh release upload "$TAG" "$RUNNER_TEMP/${tgz}" --clobber
          elif [ -n "${notes}" ]; then
            gh release create "$TAG" --title "$TAG" --notes "${notes}" "$RUNNER_TEMP/${tgz}"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes "$RUNNER_TEMP/${tgz}"
          fi
