name: mirror to gitee

# 每次推送到 GitHub 后，把 main 与 tags 镜像到 Gitee（国内可直达）。
#
# 为什么不用 Gitee 自带的「仓库镜像管理」：该功能在账号上不可用
# （GET /repos/{owner}/{repo}/mirror 返回 404 Not Found Project），
# 所以同步方向反过来由 GitHub 主动推。
#
# 需要仓库 Secret：GITEE_TOKEN
#   —— Gitee 私人令牌，权限只需 projects（仓库读写），有效期尽量短，
#      过期后重新生成并更新这个 Secret 即可。
#
# 令牌只经凭据助手按需提供给 git，不写进 remote URL，
# 因此它既不会出现在 runner 的 git 输出里，也不会落到 .git/config。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    # 卡住的任务比失败的任务糟：给整个 job 一个硬上限，超时就红，不要悬着。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # 全量历史，否则 --all / --tags 推不出完整对象图。
          fetch-depth: 0

      # 先探连通性：这样一旦失败，日志能直接区分「网络不通」与「认证被拒」，
      # 不必再从 git 的沉默里猜。（首次实测踩到过 push 静默挂起 5 分钟以上。）
      - name: Probe Gitee reachability
        run: |
          curl -sS -o /dev/null -w 'gitee.com HTTP %{http_code} in %{time_total}s\n' \
            --max-time 20 --retry 2 \
            https://gitee.com/stone_zhan/dsh-report-ledger

      - name: Push main and tags to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          # CI 里没有 TTY：万一需要交互式输入凭据，立刻失败而不是无限等待。
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::error::GITEE_TOKEN secret is not set for this repository"
            exit 1
          fi

          git remote add gitee https://gitee.com/stone_zhan/dsh-report-ledger.git

          # 用函数而不是把整条命令塞进变量：helper 里含空格与分号，
          # 变量展开会被 word-split 拆坏（踩过：git: '{' is not a git command）。
          gp() {
            git \
              -c credential.helper='!f() { echo username=stone_zhan; echo password=$GITEE_TOKEN; }; f' \
              -c http.lowSpeedLimit=1000 \
              -c http.lowSpeedTime=60 \
              push "$@"
          }

          gp gitee --all
          gp gitee --tags
          echo "mirrored $(git rev-parse --short HEAD) to Gitee"
